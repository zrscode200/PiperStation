#:schema https://developers.openai.com/codex/config-schema.json

# Keep user/host model, reasoning, memory and permission choices.
# This layer installs Piper behavior, roles and lifecycle reminders.

experimental_compact_prompt_file = "compact-prompt.md"

[features]
hooks = true

[agents.investigator]
config_file = "./agents/investigator.toml"

[agents.implementer]
config_file = "./agents/implementer.toml"

[agents.reviewer]
config_file = "./agents/reviewer.toml"

[[skills.config]]
path = "./skills/brainstorm"
enabled = true

[[skills.config]]
path = "./skills/design-studio"
enabled = true

[[skills.config]]
path = "./skills/piper-workflow"
enabled = true

[[skills.config]]
path = "./skills/automation-policy"
enabled = true

[[skills.config]]
path = "./skills/review"
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
