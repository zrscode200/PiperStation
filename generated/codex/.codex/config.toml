#:schema https://developers.openai.com/codex/config-schema.json

# Keep user/host model, reasoning, memory and permission choices.
# This layer installs Piper behavior, roles and lifecycle reminders.

experimental_compact_prompt_file = "compact-prompt.md"

[features]
hooks = true

[agents.architect]
config_file = "./agents/architect.toml"

[agents.docs_researcher]
config_file = "./agents/docs-researcher.toml"

[agents.implementer]
config_file = "./agents/implementer.toml"

[agents.reviewer]
config_file = "./agents/reviewer.toml"

[agents.security_reviewer]
config_file = "./agents/security-reviewer.toml"

[agents.tester]
config_file = "./agents/tester.toml"

[agents.verifier]
config_file = "./agents/verifier.toml"

[[skills.config]]
path = "./skills/brainstorm"
enabled = true

[[skills.config]]
path = "./skills/design-studio"
enabled = true

[[skills.config]]
path = "./skills/piper-workflow"
enabled = true

[[skills.config]]
path = "./skills/automation-policy"
enabled = true

[[skills.config]]
path = "./skills/review"
enabled = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
